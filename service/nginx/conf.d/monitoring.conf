# Monitoring and health check configuration
# This file provides endpoints for monitoring nginx and upstream services

# Health check server block (can be on a different port for internal monitoring)
server {
    listen 8081;
    server_name localhost;
    
    # Disable access logging for monitoring endpoints
    access_log off;
    
    # Basic health check
    location /health {
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Detailed health check with upstream status
    location /health/detailed {
        access_log /var/log/nginx/health.log;
        
        # Return JSON health status
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601","server":"nginx","upstreams":{"api":"unknown","frontend":"unknown"}}';
    }
    
    # nginx status endpoint (requires stub_status module)
    location /nginx_status {
        stub_status on;
        
        # Restrict access to monitoring systems
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    
    # Metrics endpoint for Prometheus-style monitoring
    location /metrics {
        add_header Content-Type text/plain;
        
        # Basic metrics (would need additional modules for full Prometheus support)
        return 200 "# HELP nginx_up nginx is running\n# TYPE nginx_up gauge\nnginx_up 1\n";
        
        # Restrict access
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    
    # Configuration test endpoint
    location /config/test {
        add_header Content-Type application/json;
        return 200 '{"config_test":"passed","timestamp":"$time_iso8601"}';
        
        # Restrict access
        allow 127.0.0.1;
        deny all;
    }
}