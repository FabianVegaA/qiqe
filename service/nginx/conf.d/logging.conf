# Enhanced logging configuration for nginx proxy replacement
# This file provides additional logging and monitoring configurations

# Custom log formats for different purposes
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for"';

log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

# Debug log format with additional upstream information
log_format debug '$time_local - $remote_addr - $request - $status - '
                 '$body_bytes_sent - $request_time - $upstream_addr - '
                 '$upstream_status - $upstream_response_time - '
                 '$upstream_connect_time - $upstream_header_time';

# Error log format for structured error reporting
log_format error_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"level":"error",'
    '"message":"$request",'
    '"client":"$remote_addr",'
    '"status":"$status",'
    '"upstream":"$upstream_addr",'
    '"request_time":"$request_time",'
    '"user_agent":"$http_user_agent"'
    '}';

# Performance monitoring log format
log_format performance '$time_iso8601|$remote_addr|$request|$status|'
                      '$body_bytes_sent|$request_time|$upstream_response_time|'
                      '$upstream_connect_time|$upstream_header_time';