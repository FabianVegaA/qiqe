# Simple development nginx configuration
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Simple log format for development
    log_format dev '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';
    
    # Logging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log dev;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Upstream definitions
    upstream interpreter_service {
        server interpreter:8000;
    }
    
    upstream frontend_service {
        server frontend:3000;
    }
    
    # Main server
    server {
        listen 80;
        server_name localhost;
        
        # Health check
        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","environment":"development"}';
        }
        
        # API endpoints
        location ~ ^/(codegen|lib)$ {
            # CORS headers for development
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # Proxy to interpreter service
            proxy_pass http://interpreter_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Static files
        location ~ ^/file/(.+)$ {
            alias /app/qiqe/library/$1;
        }
        
        # Frontend application
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}